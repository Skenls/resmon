services:
  resmon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resmon_web
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # Optional on pure Linux servers: uncomment network_mode: "host" if not using port mapping
    # network_mode: "host"
    pid: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    environment:
      - PORT=${PORT:-8080}
      - HOST=${HOST:-0.0.0.0}
      - UPDATE_INTERVAL=${UPDATE_INTERVAL:-1.0}
      - HISTORY_POINTS=${HISTORY_POINTS:-900}
      - HOST_PROC=${HOST_PROC:-/host/proc}
      - HOST_SYS=${HOST_SYS:-/host/sys}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY:-resmon-default-secret-change-in-production}
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
