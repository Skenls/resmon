services:
  resmon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resmon_web
    restart: unless-stopped
    ports:
      # Loopback only: Caddy on the same host terminates TLS and proxies here.
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/ufw:/host/etc/ufw:ro
      - /var/log/journal:/host/var/log/journal:ro
      - /run/log/journal:/host/run/log/journal:ro
    environment:
      - PORT=${PORT:-8080}
      - HOST=${HOST:-0.0.0.0}
      - UPDATE_INTERVAL=${UPDATE_INTERVAL:-1.0}
      - HISTORY_POINTS=${HISTORY_POINTS:-900}
      - HOST_PROC=${HOST_PROC:-/host/proc}
      - HOST_SYS=${HOST_SYS:-/host/sys}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:?AUTH_PASSWORD must be set}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - MAX_WS_CLIENTS=${MAX_WS_CLIENTS:-100}
      - MAX_WS_CLIENTS=${MAX_WS_CLIENTS:-100}
      - MCP_ENABLED=${MCP_ENABLED:-false}
      - MCP_API_KEY=${MCP_API_KEY:-}
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
